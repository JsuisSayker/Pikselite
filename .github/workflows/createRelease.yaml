name: Create Release

on:
  # workflow_call:
  push:
    branches:
        - main
        - installer_creation
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Prerelease suffix (e.g. alpha, beta, rc). Leave empty for a stable release.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:

  release:
    runs-on: [self-hosted, Windows, X64]

    env:
      BUILD_DIR: build
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\external\overlay-ports
      VCPKG_CACHE_KEY: "windows-vcpkg-v1"
      VCPKG_SETUP_CACHE_KEY: "windows-vcpkg-setup-v1"
      CI: false

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      prerelease: ${{ steps.resolve.outputs.is_prerelease }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # - name: Resolve version, tag and release name
    #   id: resolve
    #   shell: cmd
    #   run: |
    #     setlocal enabledelayedexpansion

    #     set "PRERELEASE_SUFFIX=${{ github.event.inputs.prerelease }}"

    #     if not defined PRERELEASE_SUFFIX (
    #       set "PRERELEASE_SUFFIX="
    #     ) else (
    #       set "PRERELEASE_SUFFIX=-!PRERELEASE_SUFFIX!"
    #     )

    #     for /f "tokens=*" %%i in ('git describe --tags --abbrev=0') do (
    #       set "LATEST_TAG=%%i"
    #     )

    #     for /f "tokens=1,2,3 delims=." %%a in ("!LATEST_TAG!") do (
    #       set /a "MAJOR=%%a"
    #       set /a "MINOR=%%b"
    #       set /a "PATCH=%%c + 1"
    #     )

    #     set "VERSION=!MAJOR!.!MINOR!.!PATCH!!PRERELEASE_SUFFIX!"
    #     set "TAG_NAME=v!VERSION!"

    #     echo Version: !VERSION!
    #     echo Tag Name: !TAG_NAME!

    #     echo version=!VERSION! >> "%GITHUB_OUTPUT%"
    #     echo tag_name=!TAG_NAME! >> "%GITHUB_OUTPUT%"

    #     if defined PRERELEASE_SUFFIX (
    #       echo is_prerelease=true >> "%GITHUB_OUTPUT%"
    #     ) else (
    #       echo is_prerelease=false >> "%GITHUB_OUTPUT%"
    #     )

    - name: Restore vcpkg setup from cache
      shell: cmd
      run: |
        set "CACHE_DIR=%LOCALAPPDATA%\temp\vcpkg-cache"
        set "VCPKG_SETUP_ZIP=%CACHE_DIR%\%VCPKG_SETUP_CACHE_KEY%.zip"
        if exist "%VCPKG_SETUP_ZIP%" (
          echo === Restoring vcpkg setup from cache ===
          if exist "%VCPKG_ROOT%" rmdir /s /q "%VCPKG_ROOT%"
          powershell -Command "Expand-Archive -Path '%VCPKG_SETUP_ZIP%' -DestinationPath '%VCPKG_ROOT%' -Force"
          echo === Vcpkg setup restored from cache ===
        ) else (
          echo === No cached vcpkg setup found ===
        )

    - name: Setup vcpkg
      shell: cmd
      run: |
        if not exist "%VCPKG_ROOT%" (
          git clone https://github.com/microsoft/vcpkg "%VCPKG_ROOT%"
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat"
        )

    - name: Build Installer
      shell: cmd
      run: |
        installer\build_installer.bat %VERSION%
      env:
        VERSION: ${{ steps.resolve.outputs.version }}

    - name: Verify installer artifact
      shell: cmd
      run: |
        echo Version: %VERSION%
        echo Expected artifact:
        echo installer\output\PikseliteEngine-Setup-%VERSION%.exe

        if not exist "installer\output\PikseliteEngine-Setup-%VERSION%.exe" (
          echo Installer artifact not found!
          echo Contents of installer\output:
          dir "installer\output"
          exit /b 1
        )

        echo Installer artifact found!
      env:
        VERSION: ${{ steps.resolve.outputs.version }}

    - name: Create and push Git tag
      shell: cmd
      env:
        TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag "%TAG_NAME%" "%GITHUB_SHA%"
        git push origin "%TAG_NAME%"

    - name: Create GitHub Release and attach installer
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.resolve.outputs.tag_name }}
        name: Release ${{ steps.resolve.outputs.version }}
        body: |
          Automated release generated from the `main` branch.

          Version: `${{ steps.resolve.outputs.version }}`

          ## Downloads
          - [PikseliteEngine-Setup-${{ steps.resolve.outputs.version }}.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.resolve.outputs.tag_name }}/PikseliteEngine-Setup-${{ steps.resolve.outputs.version }}.exe)
        files: installer/output/PikseliteEngine-Setup-${{ steps.resolve.outputs.version }}.exe
        prerelease: ${{ steps.resolve.outputs.is_prerelease }}
        generate_release_notes: true
