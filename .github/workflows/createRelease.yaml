name: Create Release

on:
  push:
    branches:
      - installer_creation
  # pull_request:
  #   branches:
  #       - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Prerelease suffix (e.g. alpha, beta, rc). Leave empty for a stable release.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:

  release:
    runs-on: [self-hosted, Windows, X64]

    env:
      BUILD_DIR: build
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\external\overlay-ports
      VCPKG_CACHE_KEY: "windows-vcpkg-v1"
      VCPKG_SETUP_CACHE_KEY: "windows-vcpkg-setup-v1"
      CI: false

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      prerelease: ${{ steps.resolve.outputs.is_prerelease }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve version, tag and release name
      id: resolve
      shell: cmd
      run: |
        setlocal enabledelayedexpansion

        echo ========================================
        echo Finding latest version tag
        echo ========================================

        set "LATEST_TAG="

        for /f "delims=" %%i in ('git tag --sort=-v:refname') do (
          if not defined LATEST_TAG set "LATEST_TAG=%%i"
        )

        if not defined LATEST_TAG (
          echo ERROR: No Git tags found!
          echo.
          echo Available tags:
          git tag --list
          exit /b 1
        )

        echo Latest tag: [!LATEST_TAG!]

        rem ========================================
        rem Remove leading "v"
        rem v1.0.2-alpha -> 1.0.2-alpha
        rem ========================================

        set "LATEST_VERSION=!LATEST_TAG:v=!"

        echo Latest version: [!LATEST_VERSION!]

        rem ========================================
        rem Remove prerelease suffix
        rem 1.0.2-alpha -> 1.0.2
        rem ========================================

        set "BASE_VERSION="

        for /f "tokens=1 delims=-" %%a in ("!LATEST_VERSION!") do (
          set "BASE_VERSION=%%a"
        )

        echo Base version: [!BASE_VERSION!]

        rem ========================================
        rem Split version
        rem 1.0.2 -> MAJOR=1 MINOR=0 PATCH=2
        rem ========================================

        for /f "tokens=1,2,3 delims=." %%a in ("!BASE_VERSION!") do (
          set "MAJOR=%%a"
          set "MINOR=%%b"
          set "PATCH=%%c"
        )

        echo Major: [!MAJOR!]
        echo Minor: [!MINOR!]
        echo Patch: [!PATCH!]

        rem ========================================
        rem Increment patch
        rem ========================================

        set /a PATCH+=1

        rem ========================================
        rem Determine prerelease suffix
        rem ========================================

        set "PRERELEASE_SUFFIX="

        if "${{ github.event_name }}"=="push" (
          set "PRERELEASE_SUFFIX=-alpha"
        ) else (
          set "PRERELEASE_INPUT=${{ github.event.inputs.prerelease }}"

          if defined PRERELEASE_INPUT (
            set "PRERELEASE_SUFFIX=-!PRERELEASE_INPUT!"
          )
        )

        echo Prerelease suffix: [!PRERELEASE_SUFFIX!]

        rem ========================================
        rem Build new version
        rem ========================================

        set "VERSION=!MAJOR!.!MINOR!.!PATCH!!PRERELEASE_SUFFIX!"
        set "TAG_NAME=v!VERSION!"

        echo ========================================
        echo Latest tag:   [!LATEST_TAG!]
        echo Base version: [!BASE_VERSION!]
        echo New version:   [!VERSION!]
        echo New tag:       [!TAG_NAME!]
        echo ========================================

        rem ========================================
        rem GitHub Actions outputs
        rem ========================================

        echo version=!VERSION!>>"%GITHUB_OUTPUT%"
        echo tag_name=!TAG_NAME!>>"%GITHUB_OUTPUT%"

        if defined PRERELEASE_SUFFIX (
          echo is_prerelease=true>>"%GITHUB_OUTPUT%"
        ) else (
          echo is_prerelease=false>>"%GITHUB_OUTPUT%"
        )

    - name: Restore vcpkg setup from cache
      shell: cmd
      run: |
        set "CACHE_DIR=%LOCALAPPDATA%\temp\vcpkg-cache"
        set "VCPKG_SETUP_ZIP=%CACHE_DIR%\%VCPKG_SETUP_CACHE_KEY%.zip"
        if exist "%VCPKG_SETUP_ZIP%" (
          echo === Restoring vcpkg setup from cache ===
          if exist "%VCPKG_ROOT%" rmdir /s /q "%VCPKG_ROOT%"
          powershell -Command "Expand-Archive -Path '%VCPKG_SETUP_ZIP%' -DestinationPath '%VCPKG_ROOT%' -Force"
          echo === Vcpkg setup restored from cache ===
        ) else (
          echo === No cached vcpkg setup found ===
        )

    - name: Setup vcpkg
      shell: cmd
      run: |
        if not exist "%VCPKG_ROOT%" (
          git clone https://github.com/microsoft/vcpkg "%VCPKG_ROOT%"
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat"
        )

    - name: Build Installer
      shell: cmd
      run: |
        installer\build_installer.bat %VERSION%
      env:
        VERSION: ${{ steps.resolve.outputs.version }}

    - name: Verify installer artifact
      shell: cmd
      run: |
        echo Checking for installer artifact...
        echo.

        if exist "installer\output\PikseliteEngine-Setup-${{ steps.resolve.outputs.version }}.exe" (
          echo Installer artifact found.
        ) else (
          echo ERROR: Installer artifact not found!
          exit /b 1
        )

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: pikselite-installer
        path: installer/output/PikseliteEngine-Setup-${{ steps.resolve.outputs.version }}.exe
        if-no-files-found: error

    - name: Create and push Git tag
      shell: cmd
      env:
        TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag "%TAG_NAME%" "%GITHUB_SHA%"
        git push origin "%TAG_NAME%"

    - name: Create GitHub Release and attach installer
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.resolve.outputs.tag_name }}
        name: Release ${{ steps.resolve.outputs.version }}
        body: |
          Automated release generated from the `main` branch.

          Version: `${{ steps.resolve.outputs.version }}`

          ## Downloads
          - [PikseliteEngine-Setup-${{ steps.resolve.outputs.version }}.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.resolve.outputs.tag_name }}/PikseliteEngine-Setup-${{ steps.resolve.outputs.version }}.exe)
        files: installer/output/PikseliteEngine-Setup-${{ steps.resolve.outputs.version }}.exe
        prerelease: ${{ steps.resolve.outputs.is_prerelease }}
        generate_release_notes: true

  mirror_prerelease:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: pikselite-installer
          path: installer/output/

      - name: Fetch tag
        run: git fetch --tags --force

      - name: Push tag to public repo
        run: |
          git remote add public "${{ vars.PUBLIC_MIRROR_URL }}"
          git push public "${{ needs.release.outputs.tag_name }}"

      - name: Create Release in public repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_MIRROR_URL }}
          tag_name: ${{ needs.release.outputs.tag_name }}
          name: Release ${{ needs.release.outputs.version }}
          files: installer/output/PikseliteEngine-Setup-${{ needs.release.outputs.version }}.exe
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
