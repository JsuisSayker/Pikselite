name: generate Doxygen documentation

on:
    push:
        branches:
            - dev
            - main
            - doxygen
            - architecture_implementation
            - installer_creation
    # pull_request:
    #     branches:
    #         - dev
    #         - main
    #         - doxygen
    #         - architecture_implementation
    workflow_call:

jobs:
  build:
    uses: ./.github/workflows/checkWindowsCompilation.yaml

  generate_docs:
        runs-on: ubuntu-latest
        needs: [build]
        timeout-minutes: 15
        permissions:
            contents: write

        steps:
          - name: Checkout repository
            uses: actions/checkout@v3

          - name: Set up cache for Doxygen
            id: cache-doxygen
            uses: actions/cache@v3
            with:
                path: docs/html
                key: ${{ runner.os }}-doxygen-${{ hashFiles('**/*.cpp', '**/*.h', 'Doxyfile') }}
                restore-keys: |
                    ${{ runner.os }}-doxygen-

          - name: Install Doxygen and Graphviz
            if: steps.cache-doxygen.outputs.cache-hit != 'true'
            run: |
                sudo apt-get update
                sudo apt-get install -y doxygen graphviz

          - name: Configure Doxygen
            if: steps.cache-doxygen.outputs.cache-hit != 'true'
            run: |
              # Generate a default Doxyfile if it doesn't exist
              if [ ! -f Doxyfile ]; then
                doxygen -g
              fi
              # Update Doxyfile settings
              sed -i 's/^PROJECT_NAME.*/PROJECT_NAME = "Pikselite"/' Doxyfile
              sed -i 's/^OUTPUT_DIRECTORY.*/OUTPUT_DIRECTORY = docs/' Doxyfile
              sed -i 's/^GENERATE_LATEX.*/GENERATE_LATEX = NO/' Doxyfile
              sed -i 's/^RECURSIVE.*/RECURSIVE = YES/' Doxyfile
              sed -i 's/^GENERATE_HTML.*/GENERATE_HTML = YES/' Doxyfile

          - name: Generate Doxygen documentation
            if: steps.cache-doxygen.outputs.cache-hit != 'true'
            run: |
                doxygen Doxyfile | tee doxygen_output.log

          - name: Deploy to Cloudflare Pages
            run: |
                npm install -g wrangler
                wrangler whoami
                wrangler pages deploy docs/html --project-name pikselitedocs
            env:
              CLOUDFLARE_API_TOKEN : ${{ secrets.CLOUDFLARE_API_PAGES_TOKEN }}
              CLOUDFLARE_ACCOUNT_ID : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}