name: Check Windows Compilation
run-name: check-windows-compilation
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    env:
      BUILD_DIR: build
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\external\overlay-ports

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Restore vcpkg cache
      shell: cmd
      run: |
        powershell -ExecutionPolicy Bypass -Command "Set-Location '$env:VCPKG_ROOT'; $cacheKey = 'windows-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}'; $cacheDir = [System.IO.Path]::Combine($env:LOCALAPPDATA, 'temp', 'vcpkg-cache'); $zipPath = [System.IO.Path]::Combine($cacheDir, $cacheKey + '.zip'); if (Test-Path $zipPath) { Write-Host 'Restoring vcpkg from cache...'; if (Test-Path $env:VCPKG_ROOT) { Remove-Item -Path $env:VCPKG_ROOT -Recurse -Force }; Expand-Archive -Path $zipPath -DestinationPath $env:VCPKG_ROOT -Force; Write-Host 'Cache restored successfully' } else { Write-Host 'No cached vcpkg found, will build from scratch' }"

    - name: Setup vcpkg
      shell: cmd
      run: |
        if not exist "%VCPKG_ROOT%" (
          git clone https://github.com/microsoft/vcpkg "%VCPKG_ROOT%"
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat"
        )

    - name: Build Engine
      shell: cmd
      run: |
        build.bat

    - name: Save vcpkg cache
      shell: cmd
      if: success()
      run: |
        powershell -ExecutionPolicy Bypass -Command "$cacheKey = 'windows-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}'; $cacheDir = [System.IO.Path]::Combine($env:LOCALAPPDATA, 'temp', 'vcpkg-cache'); $zipPath = [System.IO.Path]::Combine($cacheDir, $cacheKey + '.zip'); if (-not (Test-Path $cacheDir)) { New-Item -ItemType Directory -Path $cacheDir -Force }; if (Test-Path $env:VCPKG_ROOT + '/installed') { Write-Host 'Saving vcpkg cache...'; if (Test-Path $zipPath) { Remove-Item -Path $zipPath -Force }; Compress-Archive -Path $env:VCPKG_ROOT + '/*' -DestinationPath $zipPath -CompressionLevel Optimal -Force; Write-Host ('Cache saved: ' + $zipPath) } else { Write-Host 'No vcpkg installed, skipping cache save' }"