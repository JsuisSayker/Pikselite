name: Check Windows Compilation
run-name: check-windows-compilation
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    env:
      BUILD_DIR: build
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\external\overlay-ports

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Restore vcpkg cache
      shell: cmd
      run: |
        for /f "delims=" %%v in ('echo %VCPKG_ROOT%') do powershell -ExecutionPolicy Bypass -Command "$vcpkgRoot = $args[0]; $cacheKey = 'windows-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}'; $cacheDir = Join-Path $env:LOCALAPPDATA 'temp\vcpkg-cache'; $zipPath = Join-Path $cacheDir ($cacheKey + '.zip'); if (Test-Path $zipPath) { Write-Host 'Restoring vcpkg from cache...'; if (Test-Path $vcpkgRoot) { Remove-Item -Path $vcpkgRoot -Recurse -Force }; Expand-Archive -Path $zipPath -DestinationPath $vcpkgRoot -Force; Write-Host 'Cache restored successfully' } else { Write-Host 'No cached vcpkg found, will build from scratch' }" "%%v"

    - name: Setup vcpkg
      shell: cmd
      run: |
        if not exist "%VCPKG_ROOT%" (
          git clone https://github.com/microsoft/vcpkg "%VCPKG_ROOT%"
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat"
        )

    - name: Build Engine
      shell: cmd
      run: |
        build.bat

    - name: Save vcpkg cache
      shell: cmd
      if: success()
      run: |
        for /f "delims=" %%v in ('echo %VCPKG_ROOT%') do powershell -ExecutionPolicy Bypass -Command "$vcpkgRoot = $args[0]; $cacheKey = 'windows-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}'; $cacheDir = Join-Path $env:LOCALAPPDATA 'temp\vcpkg-cache'; $zipPath = Join-Path $cacheDir ($cacheKey + '.zip'); if (-not (Test-Path $cacheDir)) { New-Item -ItemType Directory -Path $cacheDir -Force }; $installedPath = Join-Path $vcpkgRoot 'installed'; if (Test-Path $installedPath) { Write-Host 'Saving vcpkg cache...'; if (Test-Path $zipPath) { Remove-Item -Path $zipPath -Force }; Compress-Archive -Path (Join-Path $vcpkgRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force; Write-Host ('Cache saved: ' + $zipPath) } else { Write-Host 'No vcpkg installed, skipping cache save' }" "%%v"