name: Static Checks
run-name: ${{github.event_name}}-${{github.actor}}-${{github.run_id}}

on:
    push:
        branches-ignore:
            - "ga-ignore-*"
    pull_request:
        branches-ignore:
            - "ga-ignore-*"


jobs:
    static_checks:
        runs-on: windows-latest

        env:
            BUILD_DIR: build
            VCPKG_ROOT: ${{ github.workspace }}\vcpkg
            VCPKG_DEFAULT_TRIPLET: x64-windows
            VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\external\overlay-ports
            CI: true

        steps:
