            - name: Verify formatting
              shell: bash
              run: |
                CLANG_FORMAT="/c/Program Files/LLVM/bin/clang-format.exe"

                while IFS= read -r file; do
                  "$CLANG_FORMAT" -i --style=file "$file"
                done < <(git ls-files '*.cpp' '*.hpp' '*.h')

                git diff --exit-code

